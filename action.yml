name: readme-studio
description: Build an animated, bilingual GitHub profile README from one JSON file — pure SVG, zero JavaScript.
author: yyakowvw
branding:
  icon: star
  color: purple
inputs:
  config:
    description: Path to the profile config, relative to the repository root.
    default: profile.json
  commit:
    description: Commit and push the regenerated files ("true" or "false").
    default: "true"
  message:
    description: Commit message.
    default: "Rebuild profile with readme-studio"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install fontTools
      shell: bash
      run: python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"
    - name: Build
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        CONFIG: ${{ inputs.config }}
      run: python -m studio build "$CONFIG"
    - name: Commit
      if: inputs.commit == 'true'
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then echo "Profile already up to date."; exit 0; fi
        git commit -m "$MESSAGE"
        git push
