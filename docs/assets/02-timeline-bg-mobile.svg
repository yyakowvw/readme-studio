<svg xmlns="http://www.w3.org/2000/svg" width="600" height="686" viewBox="0 0 600 686" role="img" aria-labelledby="title desc"><title id="title">Четири стъпки</title><desc id="desc">01 Копирайте: Започнете от examples/profile.json; 02 Редактирайте: Вашият текст, проекти, технологии и тема; 03 Генерирайте: python -m studio build; 04 Публикувайте: Или оставете GitHub Action да го направи</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A26"/><stop offset="0.6" stop-color="#170F45"/><stop offset="1" stop-color="#071B2B"/></linearGradient><linearGradient id="rib" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0" stop-color="#8B5CF6"/><stop offset="0.3333333333333333" stop-color="#F472B6"/><stop offset="0.6666666666666666" stop-color="#22D3EE"/><stop offset="1.0" stop-color="#34D399"/></linearGradient><radialGradient id="au"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity="0.122"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="s0"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.6"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity="0.210"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="s1"><stop offset="0" stop-color="#F472B6" stop-opacity="0.6"/><stop offset=".55" stop-color="#F472B6" stop-opacity="0.210"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient><radialGradient id="s2"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.6"/><stop offset=".55" stop-color="#22D3EE" stop-opacity="0.210"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="s3"><stop offset="0" stop-color="#34D399" stop-opacity="0.6"/><stop offset=".55" stop-color="#34D399" stop-opacity="0.210"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient></defs><style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace}.live{display:none}@media (prefers-reduced-motion:no-preference){.live{display:inline}.still{display:none}.st{animation:st 9.6s ease-out infinite}@keyframes st{0%{opacity:.95;transform:scale(1.25)}20%{opacity:.35;transform:scale(1)}100%{opacity:.35;transform:scale(1)}}.aur{animation:aur 30s ease-in-out infinite}@keyframes aur{50%{transform:translate(60px,-30px)}}}</style><clipPath id="frame"><rect width="600" height="686" rx="28"/></clipPath><rect width="600" height="686" rx="28" fill="url(#bg)"/><g clip-path="url(#frame)"><g class="aur"><circle cx="300" cy="343" r="309" fill="url(#au)"/></g><text x="32" y="52" font-size="18" fill="#DCD6FF" font-weight="800" letter-spacing="2.4">ЧЕТИРИ СТЪПКИ</text><path d="M80 150V554" fill="none" stroke="url(#rib)" stroke-width="10" stroke-opacity=".18" stroke-linecap="round"/><path d="M80 150V554" fill="none" stroke="url(#rib)" stroke-width="2.5" stroke-linecap="round"/><circle class="live st" style="animation-delay:0.00s;transform-box:fill-box;transform-origin:center" cx="80" cy="150" r="58" fill="url(#s0)"/><circle class="still" cx="80" cy="150" r="58" fill="url(#s0)" opacity=".35"/><circle cx="80" cy="150" r="34" fill="#0D0A26" stroke="#8B5CF6" stroke-width="2.5"/><text x="80" y="158" font-size="21" fill="#8B5CF6" font-weight="800" text-anchor="middle">01</text><text x="140" y="142" font-size="28" fill="#F7F5FF" font-weight="800">Копирайте</text><text x="140" y="174" font-size="20" fill="#DCD6FF">Започнете от examples/profile.json</text><circle class="live st" style="animation-delay:2.56s;transform-box:fill-box;transform-origin:center" cx="80" cy="276" r="58" fill="url(#s1)"/><circle class="still" cx="80" cy="276" r="58" fill="url(#s1)" opacity=".35"/><circle cx="80" cy="276" r="34" fill="#0D0A26" stroke="#F472B6" stroke-width="2.5"/><text x="80" y="284" font-size="21" fill="#F472B6" font-weight="800" text-anchor="middle">02</text><text x="140" y="268" font-size="28" fill="#F7F5FF" font-weight="800">Редактирайте</text><text x="140" y="300" font-size="20" fill="#DCD6FF">Вашият текст, проекти, технологии</text><text x="140" y="326" font-size="20" fill="#DCD6FF">и тема</text><circle class="live st" style="animation-delay:5.12s;transform-box:fill-box;transform-origin:center" cx="80" cy="428" r="58" fill="url(#s2)"/><circle class="still" cx="80" cy="428" r="58" fill="url(#s2)" opacity=".35"/><circle cx="80" cy="428" r="34" fill="#0D0A26" stroke="#22D3EE" stroke-width="2.5"/><text x="80" y="436" font-size="21" fill="#22D3EE" font-weight="800" text-anchor="middle">03</text><text x="140" y="420" font-size="28" fill="#F7F5FF" font-weight="800">Генерирайте</text><text x="140" y="452" font-size="20" fill="#DCD6FF">python -m studio build</text><circle class="live st" style="animation-delay:7.68s;transform-box:fill-box;transform-origin:center" cx="80" cy="554" r="58" fill="url(#s3)"/><circle class="still" cx="80" cy="554" r="58" fill="url(#s3)" opacity=".35"/><circle cx="80" cy="554" r="34" fill="#0D0A26" stroke="#34D399" stroke-width="2.5"/><text x="80" y="562" font-size="21" fill="#34D399" font-weight="800" text-anchor="middle">04</text><text x="140" y="546" font-size="28" fill="#F7F5FF" font-weight="800">Публикувайте</text><text x="140" y="578" font-size="20" fill="#DCD6FF">Или оставете GitHub Action да го</text><text x="140" y="604" font-size="20" fill="#DCD6FF">направи</text><g class="live"><g><circle r="18" fill="#fff" opacity=".18"/><circle r="6" fill="#fff"/><animateMotion dur="9.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear" path="M80 150V554"/></g></g></g></svg>
